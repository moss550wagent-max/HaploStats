<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HaploStats — Population Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white:       #ffffff;
    --bg:          #f8f9fb;
    --border:      #e2e6ee;
    --shadow:      0 4px 24px rgba(0, 0, 0, 0.06);
    --text:        #1a1d23;
    --text-dim:    #6b7280;
    --text-faint:  #9ca3af;
    --blue:        #0066cc;
    --blue-hover:  #0052a3;
    --blue-light:  #e8f1fa;
    --green:       #059669;
    --amber:       #d97706;
    --red:         #dc2626;
    --row-even:    #fafbfc;
    --font:        'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  html { font-size: 15px; }
  body {
    font-family: var(--font);
    background: var(--white);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }

  /* ── Header ─────────────────────────────────────────────── */

  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }
  .header h1 span { color: var(--blue); }
  .header p {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 5px;
  }
  .header .version {
    color: var(--text-faint);
    font-size: 12px;
    margin-top: 2px;
  }

  /* ── Main Card ──────────────────────────────────────────── */

  .card {
    width: 100%;
    max-width: 960px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 32px 36px;
    margin-bottom: 28px;
  }

  .card-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--text);
  }
  .card-title small {
    font-weight: 400;
    font-size: 13px;
    color: var(--text-dim);
    margin-left: 8px;
  }

  /* ── Input Grid ─────────────────────────────────────────── */

  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 20px;
    margin-bottom: 22px;
  }
  .input-group {
    display: flex;
    flex-direction: column;
  }
  .input-group label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .input-group input {
    font-family: var(--font);
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--white);
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }
  .input-group input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
  }
  .input-group input::placeholder {
    color: var(--text-faint);
    font-size: 13px;
  }

  /* Make last lone item span full width on two-column grid */
  .input-grid .input-group:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }

  /* ── Button ─────────────────────────────────────────────── */

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .btn {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    padding: 12px 40px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--blue);
    color: var(--white);
  }
  .btn-primary:hover { background: var(--blue-hover); }
  .btn-primary:disabled {
    background: #a0c4e8;
    cursor: not-allowed;
    transform: none;
  }

  /* ── Results Table ──────────────────────────────────────── */

  .results-area {
    display: none;
    animation: fadeIn 0.25s ease;
  }
  .results-area.visible { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .summary-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: var(--bg);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .summary-bar strong { color: var(--text); font-weight: 600; }

  .table-wrap {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    background: var(--bg);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    text-align: right;
    padding: 10px 12px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
  }
  thead th:first-child { text-align: center; }
  thead th:nth-child(2),
  thead th:nth-child(3) { text-align: left; }

  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  tbody td:first-child { text-align: center; color: var(--text-faint); font-weight: 600; }
  tbody td:nth-child(2),
  tbody td:nth-child(3) { text-align: left; font-size: 12px; color: var(--text); max-width: 240px; overflow: hidden; text-overflow: ellipsis; }

  tbody tr:nth-child(even) { background: var(--row-even); }
  tbody tr:hover { background: var(--blue-light); }

  .freq-zero  { color: var(--text-faint); }
  .freq-low   { color: #b91c1c; }
  .freq-mid   { color: var(--amber); }
  .freq-high  { color: var(--green); }
  .freq-top   { color: var(--blue); font-weight: 600; }

  /* ── Section divider ────────────────────────────────────── */

  .locus-section {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--blue);
    grid-column: 1 / -1;
    padding: 6px 0 2px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
  }

  /* ── Error ──────────────────────────────────────────────── */

  .error-banner {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    color: var(--red);
    font-size: 13px;
  }
  .error-banner.visible { display: block; }

  /* ── Loading spinner ────────────────────────────────────── */

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255,255,255,0.35);
    border-top-color: var(--white);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Responsive ─────────────────────────────────────────── */

  @media (max-width: 640px) {
    body { padding: 20px 12px 60px; }
    .card { padding: 20px; }
    .input-grid { grid-template-columns: 1fr; }
    table { font-size: 12px; }
    thead th, tbody td { padding: 8px 6px; }
  }
</style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────── -->

<div class="header">
  <h1>HaploStats <span>Population Explorer</span></h1>
  <p>Multi-population diplotype frequency lookup (2pq / p²)</p>
  <div class="version">v0.2.0</div>
</div>

<!-- ── Input Card ──────────────────────────────────────────── -->

<div class="card">
  <div class="card-title">Patient HLA Genotype <small>— enter unphased alleles (comma separated)</small></div>

  <div class="input-grid">

    <div class="locus-section">Class I</div>

    <div class="input-group">
      <label for="hla_a">HLA-A</label>
      <input type="text" id="hla_a" placeholder="e.g. 01:01, 03:01" autocomplete="off">
    </div>
    <div class="input-group">
      <label for="hla_c">HLA-C</label>
      <input type="text" id="hla_c" placeholder="e.g. 07:01, 07:02" autocomplete="off">
    </div>
    <div class="input-group">
      <label for="hla_b">HLA-B</label>
      <input type="text" id="hla_b" placeholder="e.g. 08:01, 44:02" autocomplete="off">
    </div>

    <div class="locus-section">Class II — DR / DQ</div>

    <div class="input-group">
      <label for="hla_drb345">HLA-DRB3/4/5</label>
      <input type="text" id="hla_drb345" placeholder="e.g. DRB3*01:01, DRB5*01:01" autocomplete="off">
    </div>
    <div class="input-group">
      <label for="hla_drb1">HLA-DRB1</label>
      <input type="text" id="hla_drb1" placeholder="e.g. 03:01, 04:01" autocomplete="off">
    </div>
    <div class="input-group">
      <label for="hla_dqa1">HLA-DQA1</label>
      <input type="text" id="hla_dqa1" placeholder="e.g. 05:01, 01:02" autocomplete="off">
    </div>
    <div class="input-group">
      <label for="hla_dqb1">HLA-DQB1</label>
      <input type="text" id="hla_dqb1" placeholder="e.g. 02:01, 03:02" autocomplete="off">
    </div>

    <div class="locus-section">Class II — DP</div>

    <div class="input-group">
      <label for="hla_dpa1">HLA-DPA1</label>
      <input type="text" id="hla_dpa1" placeholder="e.g. 01:03, 02:01" autocomplete="off">
    </div>
    <div class="input-group">
      <label for="hla_dpb1">HLA-DPB1</label>
      <input type="text" id="hla_dpb1" placeholder="e.g. 04:01, 02:01" autocomplete="off">
    </div>

  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="calcBtn" onclick="calculate()">Calculate Haplotype Frequencies</button>
  </div>

  <div class="error-banner" id="errorBanner"></div>
</div>

<!-- ── Results Card ────────────────────────────────────────── -->

<div class="card results-area" id="resultsArea">
  <div class="card-title">Imputation Results</div>

  <div class="summary-bar" id="summaryBar">
    <span id="summaryText">—</span>
    <span id="entropyText"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Haplotype 1</th>
          <th>Haplotype 2</th>
          <th>Global</th>
          <th>AFA</th>
          <th>API</th>
          <th>CAU</th>
          <th>HIS</th>
          <th>NAM</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</div>

<!-- ── Script ──────────────────────────────────────────────── -->

<script>
// ── Frequency formatting ────────────────────────────────────

function fmtFreq(val) {
  if (val === 0 || val === 0.0) return '<span class="freq-zero">—</span>';
  if (val >= 0.01) {
    const pct = (val * 100).toFixed(2);
    return `<span class="freq-top">${pct}%</span>`;
  }
  if (val >= 0.001) {
    const pct = (val * 100).toFixed(3);
    return `<span class="freq-high">${pct}%</span>`;
  }
  if (val >= 1e-5) {
    return `<span class="freq-mid">${val.toExponential(2)}</span>`;
  }
  return `<span class="freq-low">${val.toExponential(2)}</span>`;
}

// ── Main calculation ────────────────────────────────────────

function parseAlleles(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  const raw = el.value.trim();
  if (!raw) return null;
  return raw.split(',').map(s => s.trim()).filter(s => s.length > 0);
}

async function calculate() {
  const btn = document.getElementById('calcBtn');
  const banner = document.getElementById('errorBanner');
  const resultsArea = document.getElementById('resultsArea');
  const tbody = document.getElementById('resultsBody');
  const summaryText = document.getElementById('summaryText');
  const entropyText = document.getElementById('entropyText');

  // Hide previous results / errors
  resultsArea.classList.remove('visible');
  banner.classList.remove('visible');
  banner.textContent = '';

  // All 9 HLA loci the engine supports
  const fields = [
    'hla_a', 'hla_c', 'hla_b',
    'hla_drb345', 'hla_drb1', 'hla_dqa1', 'hla_dqb1',
    'hla_dpa1', 'hla_dpb1',
  ];

  // Parse inputs
  const payload = {};
  let hasData = false;

  for (const field of fields) {
    const alleles = parseAlleles(field);
    if (alleles && alleles.length >= 1) {
      payload[field] = alleles;
      hasData = true;
    }
  }

  if (!hasData) {
    banner.textContent = 'Please enter at least one HLA locus with typed alleles.';
    banner.classList.add('visible');
    return;
  }

  // Button loading state
  const originalText = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>Calculating…';
  btn.disabled = true;

  try {
    const response = await fetch('/impute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error(errData.detail || `Server error ${response.status}`);
    }

    const data = await response.json();

    // Summary bar
    const popUsed = data.population || 'Global';
    const totalPairs = data.total_possible_pairs || 0;
    const entropy = data.entropy !== undefined && data.entropy !== null
                    ? `Shannon entropy: <strong>${data.entropy.toFixed(2)}</strong> bits`
                    : '';
    summaryText.innerHTML = `<strong>${totalPairs}</strong> possible pairs · Ranking by <strong>${popUsed}</strong> posterior`;
    entropyText.innerHTML = entropy;

    // Build table rows
    const pairs = data.imputed_pairs || [];
    if (pairs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text-faint);">No matching haplotype pairs found.</td></tr>';
    } else {
      let html = '';
      for (const pair of pairs) {
        const pf = pair.population_frequencies || {};
        html += `<tr>
          <td>${pair.rank}</td>
          <td title="${escapeHtml(pair.haplotype_1)}">${escapeHtml(trunc(pair.haplotype_1, 55))}</td>
          <td title="${escapeHtml(pair.haplotype_2)}">${escapeHtml(trunc(pair.haplotype_2, 55))}</td>
          <td>${fmtFreq(pf.Global)}</td>
          <td>${fmtFreq(pf.AFA)}</td>
          <td>${fmtFreq(pf.API)}</td>
          <td>${fmtFreq(pf.CAU)}</td>
          <td>${fmtFreq(pf.HIS)}</td>
          <td>${fmtFreq(pf.NAM)}</td>
        </tr>`;
      }
      tbody.innerHTML = html;
    }

    // Show results
    resultsArea.classList.add('visible');
    resultsArea.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (err) {
    banner.textContent = err.message || 'An unexpected error occurred.';
    banner.classList.add('visible');
  } finally {
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
}

// ── Helpers ──────────────────────────────────────────────────

function trunc(str, maxLen) {
  if (!str || str.length <= maxLen) return str;
  return str.slice(0, maxLen) + '…';
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Allow Enter key to submit ───────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  const inputs = document.querySelectorAll('.input-group input');
  for (const input of inputs) {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') calculate();
    });
  }
});
</script>

</body>
</html>
